services:
  - type: web
    name: perpustakaan-jendela-ilmu
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: PORT=3000 NODE_ENV=production node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: perpustakaan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: WS_WEBHOOK_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://perpustakaan-jendela-ilmu.onrender.com
      - key: NEXTAUTH_URL
        value: https://perpustakaan-jendela-ilmu.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: perpustakaan-db
    plan: free
    databaseName: perpustakaan
