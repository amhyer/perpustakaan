services:
  - type: web
    name: perpustakaan-jendela-ilmu
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: PORT=3000 NODE_ENV=production node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./db/custom.db
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://perpustakaan-jendela-ilmu.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: SENTRY_DSN
        value: https://95d68474f906fbf68a34f317ecccbdf4@o4507003076280320.ingest.us.sentry.io/4511960652578816
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://95d68474f906fbf68a34f317ecccbdf4@o4507003076280320.ingest.us.sentry.io/4511960652578816
    healthCheckPath: /api/health
    autoDeploy: true
